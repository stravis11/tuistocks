[project]
name = "grok47-stock-tui"
version = "0.1.0"
description = "Realtime stock and crypto charts in the terminal"
readme = "README.md"
authors = [
    { name = "Steve Travis" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
    "websockets>=17.1",
]

[project.scripts]
grok47-stock-tui = "grok47_stock_tui:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
